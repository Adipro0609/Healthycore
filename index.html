<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dark Health App</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#050505;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* APP */

.app{
    width:100%;
    min-height:100vh;
    padding:28px;
    background:
    radial-gradient(circle at top right,#1f2937 0%,transparent 35%),
    radial-gradient(circle at bottom left,#14532d 0%,transparent 35%),
    #050505;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.welcome{
    font-size:14px;
    color:#8b8b8b;
    margin-bottom:6px;
}

.name{
    font-size:34px;
    font-weight:800;
    letter-spacing:-1px;
}

.profile{
    width:58px;
    height:58px;
    border-radius:50%;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    box-shadow:0 0 30px rgba(34,197,94,0.5);
}

/* HERO CARD */

.hero{
    width:100%;
    padding:30px;
    border-radius:34px;
    background:linear-gradient(135deg,#22c55e,#15803d);
    margin-bottom:26px;
    position:relative;
    overflow:hidden;
}

.hero::before{
    content:'';
    position:absolute;
    width:240px;
    height:240px;
    background:rgba(255,255,255,0.08);
    border-radius:50%;
    top:-120px;
    right:-80px;
}

.label{
    font-size:15px;
    opacity:0.9;
    margin-bottom:16px;
}

.steps{
    font-size:68px;
    font-weight:800;
    line-height:1;
    margin-bottom:14px;
}

.goal{
    font-size:15px;
    opacity:0.9;
}

.progress{
    margin-top:22px;
    width:100%;
    height:14px;
    background:rgba(255,255,255,0.2);
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:white;
    border-radius:20px;
    transition:width 0.3s ease;
}

/* STATS */

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-bottom:26px;
}

.card{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:28px;
    padding:24px;
    backdrop-filter:blur(10px);
}

.card-title{
    color:#9ca3af;
    font-size:15px;
    margin-bottom:18px;
}

.card-value{
    font-size:42px;
    font-weight:800;
    margin-bottom:8px;
}

.card-sub{
    color:#6b7280;
    font-size:13px;
}

/* CHART */

.chart-card{
    background:rgba(255,255,255,0.04);
    border-radius:32px;
    padding:28px;
    border:1px solid rgba(255,255,255,0.05);
}

.chart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.chart-header h2{
    font-size:24px;
    font-weight:700;
}

.chart-header span{
    color:#22c55e;
    font-weight:600;
}

.chart{
    height:220px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:14px;
}

.bar-wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

.bar{
    width:100%;
    border-radius:18px;
    background:linear-gradient(to top,#22c55e,#4ade80);
    box-shadow:0 0 20px rgba(34,197,94,0.35);
    animation:grow 1s ease;
}

.day{
    color:#9ca3af;
    font-size:13px;
}

@keyframes grow{
    from{
        height:0;
    }
}

/* MOBILE */

@media(max-width:600px){

    .app{
        padding:22px;
    }

    .steps{
        font-size:56px;
    }

    .card-value{
        font-size:34px;
    }

}

</style>
</head>

<body>

<div class="app">

    <div class="top">

        <div>
            <div class="welcome">
                Welcome Back
            </div>

            <div class="name">
                Fitness
            </div>
        </div>

        <div class="profile"></div>

    </div>

    <!-- HERO -->

    <div class="hero">

        <div class="label">
            Today's Steps
        </div>

        <div class="steps" id="steps">
            0
        </div>

        <div class="goal" id="goalText">
            0% of your 10,000 goal
        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

    </div>

    <!-- STATS -->

    <div class="stats">

        <div class="card">

            <div class="card-title">
                Calories Burned
            </div>

            <div class="card-value" id="calories">
                0
            </div>

            <div class="card-sub">
                kcal today
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                Distance
            </div>

            <div class="card-value" id="distance">
                0
            </div>

            <div class="card-sub">
                kilometers
            </div>

        </div>

    </div>

    <!-- CHART -->

    <div class="chart-card">

        <div class="chart-header">
            <h2>Weekly Activity</h2>
            <span>Live</span>
        </div>

        <div class="chart">

            <div class="bar-wrap">
                <div class="bar" style="height:80px;"></div>
                <div class="day">M</div>
            </div>

            <div class="bar-wrap">
                <div class="bar" style="height:120px;"></div>
                <div class="day">T</div>
            </div>

            <div class="bar-wrap">
                <div class="bar" style="height:95px;"></div>
                <div class="day">W</div>
            </div>

            <div class="bar-wrap">
                <div class="bar" style="height:170px;"></div>
                <div class="day">T</div>
            </div>

            <div class="bar-wrap">
                <div class="bar" style="height:130px;"></div>
                <div class="day">F</div>
            </div>

            <div class="bar-wrap">
                <div class="bar" style="height:190px;"></div>
                <div class="day">S</div>
            </div>

            <div class="bar-wrap">
                <div class="bar" style="height:145px;"></div>
                <div class="day">S</div>
            </div>

        </div>

    </div>

</div>

<script>

// Constants
const GOAL_STEPS = 10000;
const STEPS_PER_CALORIE = 19; // Approximate conversion
const STEPS_PER_KM = 1250; // Approximate conversion

// Get DOM elements
const stepsElement = document.getElementById("steps");
const caloriesElement = document.getElementById("calories");
const distanceElement = document.getElementById("distance");
const progressBar = document.getElementById("progressBar");
const goalText = document.getElementById("goalText");

// Initialize tracking data
let todaySteps = 0;
let lastSyncTime = Date.now();

// Load today's data from localStorage
function loadTodayData() {
    const today = new Date().toDateString();
    const storedData = localStorage.getItem("healthData");
    
    if (storedData) {
        const data = JSON.parse(storedData);
        
        // Reset if it's a new day
        if (data.date !== today) {
            data.date = today;
            data.steps = 0;
        }
        
        todaySteps = data.steps;
    } else {
        localStorage.setItem("healthData", JSON.stringify({
            date: today,
            steps: 0
        }));
    }
    
    updateUI();
}

// Save today's data to localStorage
function saveTodayData() {
    const today = new Date().toDateString();
    localStorage.setItem("healthData", JSON.stringify({
        date: today,
        steps: todaySteps
    }));
}

// Update UI with current values
function updateUI() {
    // Update steps
    stepsElement.innerText = todaySteps.toLocaleString();
    
    // Calculate and update calories (approximate: 1 calorie per 19 steps)
    const calories = Math.round(todaySteps / STEPS_PER_CALORIE);
    caloriesElement.innerText = calories;
    
    // Calculate and update distance (approximate: 1 km per 1250 steps)
    const distance = (todaySteps / STEPS_PER_KM).toFixed(2);
    distanceElement.innerText = distance;
    
    // Update progress bar
    const percentage = Math.min((todaySteps / GOAL_STEPS) * 100, 100);
    progressBar.style.width = percentage + "%";
    
    // Update goal text
    const percentageInt = Math.round(percentage);
    goalText.innerText = percentageInt + "% of your 10,000 goal";
}

// Simulate step tracking (in a real app, this would use device accelerometer)
function simulateStepTracking() {
    // Random steps added every 5 seconds (simulating natural walking)
    setInterval(() => {
        // Random number between 0-3 steps per interval
        const randomSteps = Math.floor(Math.random() * 4);
        if (randomSteps > 0) {
            todaySteps += randomSteps;
            saveTodayData();
            updateUI();
        }
    }, 5000);
}

// Request permission for accelerometer (for real step tracking)
function requestAccelerometerAccess() {
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
        DeviceMotionEvent.requestPermission()
            .then((permissionState) => {
                if (permissionState === "granted") {
                    startAccelerometerTracking();
                }
            })
            .catch(console.error);
    } else {
        // Non-iOS 13+ devices or browsers that don't support the permission API
        startAccelerometerTracking();
    }
}

// Detect steps from accelerometer
function startAccelerometerTracking() {
    let lastY = 0;
    let stepCounter = 0;
    const STEP_THRESHOLD = 15;
    
    window.addEventListener("devicemotion", (event) => {
        const acceleration = event.acceleration;
        if (!acceleration) return;
        
        const currentY = Math.abs(acceleration.y);
        const difference = Math.abs(currentY - lastY);
        
        if (difference > STEP_THRESHOLD) {
            stepCounter++;
            lastY = currentY;
            
            // Add step every 2 steps detected
            if (stepCounter >= 2) {
                todaySteps++;
                stepCounter = 0;
                saveTodayData();
                updateUI();
            }
        }
    });
}

// Initialize the app
loadTodayData();

// Add a button to manually test step tracking
const addStepButton = document.createElement("button");
addStepButton.innerText = "Add Test Steps";
addStepButton.style.cssText = `
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 20px;
    background: #22c55e;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    z-index: 1000;
`;
addStepButton.onclick = () => {
    todaySteps += 100;
    saveTodayData();
    updateUI();
};
document.body.appendChild(addStepButton);

// Start accelerometer tracking
requestAccelerometerAccess();

</script>

</body>
</html>
